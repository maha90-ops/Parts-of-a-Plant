<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مهمة إنقاذ لولو — رحلة إنقاذ لولو</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css?v=20261123g">
  <link rel="stylesheet" href="styles/pages.css?v=20261123g">
  <script defer src="js/data.js?v=20261123g"></script>
  <script defer src="js/adaptive-engine.js?v=20261123g"></script>
  <script defer src="js/student-progress.js?v=20261123g"></script>
  <script defer src="js/characters.js?v=20261123g"></script>
  <script defer src="js/app.js?v=20261123g"></script>
  <script defer src="js/village.js?v=20261123g"></script>
  <script defer src="js/puzzle.js?v=20261123g"></script>
  <script defer src="js/passport.js?v=20261123g"></script>
  <script defer src="js/map.js?v=20261123g"></script>
</head>
<body data-page="map">
  <a class="skip" href="#main">تخطَّ إلى المحتوى</a>
  <header id="app-header"></header>
  <main id="main" tabindex="-1" class="container page-pad">
    <div class="page-title row">
      <div><p class="eyebrow">🗺️ خريطة الرحلة</p><h1 class="h-md">رحلة إنقاذ لولو</h1></div>
      <span class="grow"></span><div id="map-path"></div>
    </div>
    <section class="journey-progress card" id="journey-progress" aria-label="تقدّمك في الرحلة"></section>
    <div class="map-layout">
      <section class="map-board card tatreez-frame" aria-label="مناطق الرحلة">
        <div class="map-art" aria-hidden="true" id="map-art"></div>
        <svg class="map-route" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" id="map-route"></svg>
        <ol class="map-nodes" id="map-nodes"></ol>
      </section>
      <aside class="map-side stack">
        <div class="card lulu-card">
          <div id="map-lulu"></div>
          <p class="eyebrow">صحة لولو</p>
          <div class="health"><div class="health-fill" id="health-fill"></div></div>
          <p class="health-t" id="health-t"></p>
        </div>
        <div class="card" id="next-card"></div>
        <div class="card pp-card" id="passport-card"></div>
        <div class="card" id="rec-card"></div>
      </aside>
    </div>
    <div class="fun-row">
      <section class="card fun-card" id="village-card" aria-label="قرية لولو: تحدي الخيمة والزيتون"></section>
      <section class="card fun-card" id="puzzle-card" aria-label="بازل قبة الصخرة"></section>
    </div>
  </main>
  <footer id="app-footer"></footer>
</body>
</html>
